<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider">

    <div class="slides" id="slides">

      <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1280" />

      <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1280" />

      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1280" />

      <img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=1280" />

    </div>

    <!-- Buttons -->
    <button class="nav prev" onclick="prevSlide()">❮</button>
    <button class="nav next" onclick="nextSlide()">❯</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
